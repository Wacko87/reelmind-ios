name: ReelMind
options:
  bundleIdPrefix: com.reelmind
  developmentLanguage: en
  knownRegions:
    - en
    - es
    - Base
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES

targets:
  ReelMind:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ReelMind
        excludes:
          - "App/Info.plist"
    dependencies:
      - target: ReelMindShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reelmind.app
        PRODUCT_NAME: ReelMind
        INFOPLIST_FILE: ReelMind/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO

  ReelMindShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ReelMindShare
        excludes:
          - "Info.plist"
      - path: ReelMind/Models
      - path: ReelMind/Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reelmind.app.share
        PRODUCT_NAME: ReelMindShare
        INFOPLIST_FILE: ReelMindShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
